{% extends "panel/base.html" %}

{% block title %}Create Item{% endblock %}

{% block content %}
<div class="card">
    <h2>Create Item</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Title *</label>
            <input id="title" name="title" class="form-control" required />
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control"></textarea>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input id="location" name="location" class="form-control" />
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control">
                {% for cat_id, cat_name in categories %}
                    <option value="{{ cat_id }}">{{ cat_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="finder_id">Finder ID (UID)</label>
            <input id="finder_id" name="finder_id" class="form-control" />
        </div>

        <button type="submit" class="btn btn-success">Create</button>
        <a href="{% url 'admin-items' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
